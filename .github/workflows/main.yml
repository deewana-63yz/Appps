name: Build Interexive - Easy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare HTML app
        shell: bash
        run: |
          set -euo pipefail

          if [ -f index.html ]; then
            HTML_FILE=index.html
          else
            mapfile -t FILES < <(find . -maxdepth 1 -type f -iname '*.html')
            if [ "${#FILES[@]}" -ne 1 ]; then
              echo "ERROR: Add one HTML file to the repository root, or name it index.html."
              exit 1
            fi
            HTML_FILE="${FILES[0]}"
          fi

          mkdir -p www
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='www/' --exclude='android/' --exclude='node_modules/' --exclude='package.json' --exclude='package-lock.json' --exclude='capacitor.config.json' ./ www/
          cp "$HTML_FILE" www/index.html

          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npm install --save-dev @capacitor/assets

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.interexive.easy",
            "appName": "Interexive - Easy",
            "webDir": "www"
          }
          EOF

          mkdir -p assets
          test -f logo.png || { echo "ERROR: logo.png missing from repository root"; exit 1; }
          cp logo.png assets/icon.png

          npx cap add android
          sed -i '/dependencies {/a\    implementation "com.unity3d.ads:unity-ads:4.21.0"' android/app/build.gradle
                               
          
          npx cap sync android
          npx @capacitor/assets generate --android

                - name: Initialize Unity Ads
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = list(
              Path("android/app/src/main/java").rglob("MainActivity.java")
          )

          if len(files) != 1:
              raise SystemExit(
                  f"Expected one MainActivity.java, found {len(files)}"
              )

          path = files[0]
          source = path.read_text()

          if "UnityAds.initialize(config, listener);" in source:
              print("Unity Ads initialization already exists.")
              raise SystemExit(0)

          imports = [
              "import androidx.annotation.OptIn;",
              "import com.unity3d.ads.InitializationConfiguration;",
              "import com.unity3d.ads.InitializationListener;",
              "import com.unity3d.ads.UnityAds;",
              "import com.unity3d.ads.UnityAdsExperimental;",
          ]

          package = re.search(
              r"^package\s+[\w.]+;", source, re.M
          )

          if not package:
              raise SystemExit("Java package declaration not found.")

          missing = [item for item in imports if item not in source]

          source = (
              source[:package.end()]
              + "\n\n"
              + "\n".join(missing)
              + source[package.end():]
          )

          init_code = '''
                  InitializationConfiguration config =
                      new InitializationConfiguration.Builder("800409689")
                          .withTestMode(false)
                          .build();

                  InitializationListener listener = error -> {
                      if (error == null) {
                          android.util.Log.d("UnityAds", "Initialization successful");
                      } else {
                          android.util.Log.e(
                              "UnityAds", "Initialization failed: " + error.getMessage()
                          );
                      }
                  };

                  UnityAds.initialize(config, listener);
          '''

          method = re.search(
              r'public\s+void\s+onCreate\s*\(\s*(?:(?:android\.os\.)?Bundle)\s+\w+\s*\)\s*\{',
              source
          )

          if method:
              after = re.search(
                  r'super\.onCreate\s*\(\s*\w+\s*\)\s*;',
                  source[method.end():]
              )

              if not after:
                  raise SystemExit("Could not locate super.onCreate().")

              pos = method.end() + after.end()
              source = source[:pos] + "\n" + init_code + source[pos:]

              method = re.search(
                  r'public\s+void\s+onCreate\s*\(\s*(?:(?:android\.os\.)?Bundle)\s+\w+\s*\)\s*\{',
                  source
              )

              line_start = source.rfind("\n", 0, method.start()) + 1

              if "@OptIn(markerClass = UnityAdsExperimental.class)" not in source[max(0, method.start()-160):method.start()]:
                  source = (
                      source[:line_start]
                      + "    @OptIn(markerClass = UnityAdsExperimental.class)\n"
                      + source[line_start:]
                  )
          else:
              activity = re.search(
                  r'(class\s+MainActivity\s+extends\s+BridgeActivity\s*\{)',
                  source
              )

              if not activity:
                  raise SystemExit("Could not locate MainActivity class.")

              new_method = '''
              @OptIn(markerClass = UnityAdsExperimental.class)
              @Override
              public void onCreate(android.os.Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
          ''' + init_code + '''
              }
          '''

              source = (
                  source[:activity.end()]
                  + "\n"
                  + new_method
                  + source[activity.end():]
              )

          path.write_text(source)
          print("Unity Ads initialization added.")
          PY

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Interexive-Easy-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
