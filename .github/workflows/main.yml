name: Build Interexive - Easy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare HTML app
        shell: bash
        run: |
          set -euo pipefail

          if [ -f index.html ]; then
            HTML_FILE=index.html
          else
            mapfile -t FILES < <(find . -maxdepth 1 -type f -iname '*.html')
            if [ "${#FILES[@]}" -ne 1 ]; then
              echo "ERROR: Add one HTML file to the repository root, or name it index.html."
              exit 1
            fi
            HTML_FILE="${FILES[0]}"
          fi

          mkdir -p www
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='www/' --exclude='android/' --exclude='node_modules/' --exclude='package.json' --exclude='package-lock.json' --exclude='capacitor.config.json' ./ www/
          cp "$HTML_FILE" www/index.html

          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npm install --save-dev @capacitor/assets

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.interexive.easy",
            "appName": "Interexive - Easy",
            "webDir": "www"
          }
          EOF

          mkdir -p assets
          test -f logo.png || { echo "ERROR: logo.png missing from repository root"; exit 1; }
          cp logo.png assets/icon.png

          npx cap add android
          sed -i '/dependencies {/a\    implementation "com.unity3d.ads:unity-ads:4.21.0"' android/app/build.gradle
                    mkdir -p android/app/src/main/java/com/interexive/easy
                    cat > android/app/src/main/java/com/interexive/easy/MainActivity.java <<'EOF'
          package com.interexive.easy;

          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.Log;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;

          import com.getcapacitor.BridgeActivity;
          import com.unity3d.ads.*;

          public class MainActivity extends BridgeActivity {

              private static final String GAME_ID = "800409689";
              private static final String BANNER = "BP_Banner_Android";
              private static final String INTERSTITIAL = "BP_Interstitial_Android";

              private final Handler handler = new Handler(Looper.getMainLooper());

              private LinearLayout bannerContainer;
              private BannerAd banner;
              private InterstitialAd interstitial;

              private boolean loadingBanner = false;
              private boolean loadingInterstitial = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  FrameLayout content = findViewById(android.R.id.content);

                  bannerContainer = new LinearLayout(this);
                  bannerContainer.setGravity(Gravity.CENTER);

                  FrameLayout.LayoutParams params =
                          new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT,
                                  Gravity.BOTTOM
                          );

                  content.addView(bannerContainer, params);

                  InitializationConfiguration config =
                          new InitializationConfiguration.Builder(GAME_ID)
                                  .withTestMode(false)
                                  .withLogLevel(LogLevel.DEBUG)
                                  .build();

                  UnityAds.initialize(config, error -> {
                      if (error == null) {
                          Log.d("UnityAds", "Initialization successful");

                          handler.post(() -> {
                              loadBanner();
                              loadInterstitial();
                          });
                      } else {
                          Log.e("UnityAds", "Initialization failed: " + error);
                      }
                  });
              }

              private void loadBanner() {
                  if (loadingBanner || banner != null
                          || isFinishing() || isDestroyed()) {
                      return;
                  }

                  loadingBanner = true;

                  BannerShowListener showListener = new BannerShowListener() {
                      @Override
                      public void onBannerShown(BannerAd ad) {
                          Log.d("UnityAds", "Banner shown");
                      }

                      @Override
                      public void onBannerClicked(BannerAd ad) {
                          Log.d("UnityAds", "Banner clicked");
                      }

                      @Override
                      public void onBannerFailedToShow(
                              BannerAd ad, UnityAdsError error) {
                          Log.e("UnityAds", "Banner display failed: " + error);
                      }
                  };

                  BannerLoadConfiguration config =
                          new BannerLoadConfiguration.Builder(
                                  BANNER, new BannerSize(320, 50))
                                  .withListener(showListener)
                                  .build();

                  BannerAd.load(config, (ad, error) ->
                          handler.post(() -> {
                              loadingBanner = false;

                              if (ad != null && error == null) {
                                  View adView = ad.getView();

                                  if (adView != null) {
                                      banner = ad;
                                      bannerContainer.removeAllViews();

                                      if (adView.getParent() instanceof ViewGroup) {
                                          ((ViewGroup) adView.getParent())
                                                  .removeView(adView);
                                      }

                                      bannerContainer.addView(
                                              adView,
                                              new LinearLayout.LayoutParams(
                                                      ViewGroup.LayoutParams.WRAP_CONTENT,
                                                      ViewGroup.LayoutParams.WRAP_CONTENT
                                              )
                                      );

                                      Log.d("UnityAds", "Banner loaded successfully");
                                      return;
                                  }
                              }

                              Log.e("UnityAds", "Banner load failed: "
                                      + String.valueOf(error));

                              handler.postDelayed(this::loadBanner, 60000L);
                          })
                  );
              }

              private void loadInterstitial() {
                  if (loadingInterstitial || interstitial != null
                          || isFinishing() || isDestroyed()) {
                      return;
                  }

                  loadingInterstitial = true;

                  LoadConfiguration config =
                          new LoadConfiguration.Builder(INTERSTITIAL).build();

                  InterstitialAd.load(config, (ad, error) ->
                          handler.post(() -> {
                              loadingInterstitial = false;

                              if (ad != null && error == null) {
                                  interstitial = ad;

                                  Log.d("UnityAds",
                                          "Interstitial loaded successfully");

                                  ad.setOnAdExpired(expiredAd ->
                                          handler.post(() -> {
                                              if (interstitial == expiredAd) {
                                                  interstitial = null;
                                              }
                                              loadInterstitial();
                                          })
                                  );
                              } else {
                                  Log.e("UnityAds", "Interstitial load failed: "
                                          + String.valueOf(error));

                                  handler.postDelayed(
                                          this::loadInterstitial, 60000L);
                              }
                          })
                  );
              }

              @Override
              protected void onDestroy() {
                  handler.removeCallbacksAndMessages(null);
                  super.onDestroy();
              }
          }
          EOF
                            

                    
          npx cap sync android
          npx @capacitor/assets generate --android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Interexive-Easy-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
