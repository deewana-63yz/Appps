name: Build Interexive - Easy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare HTML and Capacitor project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p www
          if [ -f index.html ]; then
            cp index.html www/index.html
          else
            mapfile -t html_files < <(find . -maxdepth 1 -type f -iname '*.html' -printf '%f\n' | sort)
            if [ "${#html_files[@]}" -ne 1 ]; then
              echo "ERROR: Put index.html in the repository root (recommended), or keep exactly one root-level HTML file."
              exit 1
            fi
            cp "${html_files[0]}" www/index.html
          fi

          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7

          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.interexive.easy",
            "appName": "Interexive - Easy",
            "webDir": "www"
          }
          JSON

          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Add Unity Ads SDK and permissions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('android/app/build.gradle')
          if not gradle.exists():
              raise SystemExit('ERROR: android/app/build.gradle was not generated.')
          text = gradle.read_text(encoding='utf-8')
          dependency = 'implementation "com.unity3d.ads:unity-ads:4.21.0"'
          if dependency not in text:
              match = re.search(r'(?m)^\s*dependencies\s*\{', text)
              if not match:
                  raise SystemExit('ERROR: Could not find dependencies { in android/app/build.gradle.')
              text = text[:match.end()] + '\n    ' + dependency + text[match.end():]
              gradle.write_text(text, encoding='utf-8')

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          if 'android.permission.INTERNET' not in text:
              text = re.sub(r'(<manifest\b[^>]*>)', r'\1\n    <uses-permission android:name="android.permission.INTERNET" />', text, count=1)
              manifest.write_text(text, encoding='utf-8')
          PY

      - name: Integrate Unity Ads into MainActivity (no timer; transition-triggered interstitial)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/java/com/interexive/easy
          cat > android/app/src/main/java/com/interexive/easy/MainActivity.java <<'JAVA'
          package com.interexive.easy;

          import android.os.Bundle;
          import android.app.AlertDialog;
          import android.util.Log;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.WebView;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.Toast;

          import com.getcapacitor.BridgeActivity;
          import com.unity3d.ads.*;

          public class MainActivity extends BridgeActivity {
              private static final String TAG = "InterexiveUnityAds";
              private static final String GAME_ID = "800409689";
              private static final String BANNER_ID = "BP_Banner_Android";
              private static final String INTERSTITIAL_ID = "BP_Interstitial_Android";
              private static final String REWARDED_ID = "BP_Rewarded_Android";
              private static final int BANNER_HEIGHT_DP = 50;

              private FrameLayout contentRoot;
              private WebView webView;
              private View bannerView;
              private Button rewardedButton;
              private BannerAd bannerAd;
              private InterstitialAd interstitialAd;
              private RewardedAd rewardedAd;
              private boolean loadingInterstitial = false;
              private boolean loadingRewarded = false;
              private boolean unityReady = false;
              private boolean adShowing = false;
              private boolean foreground = false;
              private boolean resumeInterstitialPending = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  contentRoot = findViewById(android.R.id.content);
                  try {
                      webView = getBridge().getWebView();
                      if (webView != null) {
                          webView.setPadding(webView.getPaddingLeft(), webView.getPaddingTop(),
                                  webView.getPaddingRight(), dp(BANNER_HEIGHT_DP + 56));
                      }
                  } catch (Exception e) {
                      Log.e(TAG, "Could not prepare WebView padding", e);
                  }
                  addRewardedOptInButton();
                  initializeUnityAds();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  foreground = true;
                  // No repeating timer: show only on a return-to-app transition.
                  if (resumeInterstitialPending && !adShowing) {
                      if (interstitialAd != null) {
                          resumeInterstitialPending = false;
                          showInterstitialNow();
                      } else {
                          loadInterstitial();
                      }
                  }
              }

              @Override
              protected void onPause() {
                  // Do not treat the ad SDK's own full-screen presentation as an app return.
                  if (!adShowing) resumeInterstitialPending = true;
                  foreground = false;
                  super.onPause();
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
              }

              private int dp(int value) {
                  return Math.round(value * getResources().getDisplayMetrics().density);
              }

              private void initializeUnityAds() {
                  InitializationConfiguration configuration = new InitializationConfiguration.Builder(GAME_ID)
                          .withTestMode(false)
                          .build();
                  UnityAds.initialize(configuration, error -> runOnUiThread(() -> {
                      if (error != null) {
                          Log.e(TAG, "Unity Ads initialization failed: " + error.getMessage());
                          return;
                      }
                      unityReady = true;
                      loadBanner();
                      loadInterstitial();
                      loadRewarded();
                  }));
              }

              private void loadBanner() {
                  if (!unityReady || bannerAd != null) return;
                  BannerShowListener showListener = new BannerShowListener() {
                      @Override public void onBannerShown(BannerAd ad) { Log.d(TAG, "Banner shown"); }
                      @Override public void onBannerClicked(BannerAd ad) { Log.d(TAG, "Banner clicked"); }
                      @Override public void onBannerFailedToShow(BannerAd ad, UnityAdsError error) {
                          Log.e(TAG, "Banner display failed: " + error.getMessage());
                      }
                  };
                  BannerLoadConfiguration configuration = new BannerLoadConfiguration.Builder(
                          BANNER_ID, new BannerSize(320, BANNER_HEIGHT_DP))
                          .withListener(showListener)
                          .build();
                  BannerAd.load(configuration, (loadedAd, error) -> runOnUiThread(() -> {
                      if (loadedAd == null || error != null) {
                          Log.e(TAG, "Banner load failed: " + (error == null ? "unknown error" : error.getMessage()));
                          return;
                      }
                      bannerAd = loadedAd;
                      View view = loadedAd.getView();
                      if (view == null || contentRoot == null) {
                          Log.e(TAG, "Banner loaded but its View is null");
                          return;
                      }
                      if (view.getParent() instanceof ViewGroup) {
                          ((ViewGroup) view.getParent()).removeView(view);
                      }
                      bannerView = view;
                      FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(
                              dp(320), dp(BANNER_HEIGHT_DP), Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL);
                      contentRoot.addView(view, params);
                  }));
              }

              private void loadInterstitial() {
                  if (!unityReady || loadingInterstitial || interstitialAd != null) return;
                  loadingInterstitial = true;
                  LoadConfiguration configuration = new LoadConfiguration.Builder(INTERSTITIAL_ID).build();
                  InterstitialAd.load(configuration, (loadedAd, error) -> runOnUiThread(() -> {
                      loadingInterstitial = false;
                      if (loadedAd == null || error != null) {
                          Log.e(TAG, "Interstitial load failed: " + (error == null ? "unknown error" : error.getMessage()));
                          return;
                      }
                      interstitialAd = loadedAd;
                      loadedAd.setOnAdExpired(expired -> runOnUiThread(() -> {
                          if (interstitialAd == expired) interstitialAd = null;
                          loadInterstitial();
                      }));
                      if (resumeInterstitialPending && foreground && !adShowing) {
                          resumeInterstitialPending = false;
                          showInterstitialNow();
                      }
                  }));
              }

              private void showInterstitialNow() {
                  if (!unityReady || adShowing || interstitialAd == null) {
                      loadInterstitial();
                      return;
                  }
                  resumeInterstitialPending = false;
                  InterstitialAd ad = interstitialAd;
                  interstitialAd = null;
                  adShowing = true;
                  ad.show(this, new ShowConfiguration.Builder().build(), new InterstitialShowListener() {
                      @Override public void onStarted(InterstitialAd shownAd) { Log.d(TAG, "Interstitial started"); }
                      @Override public void onClicked(InterstitialAd shownAd) { Log.d(TAG, "Interstitial clicked"); }
                      @Override public void onCompleted(InterstitialAd shownAd, ShowFinishState state) {
                          finishFullScreenAd();
                      }
                      @Override public void onFailed(InterstitialAd shownAd, UnityAdsError error) {
                          Log.e(TAG, "Interstitial show failed: " + error.getMessage());
                          finishFullScreenAd();
                      }
                  });
              }

              private void loadRewarded() {
                  if (!unityReady || loadingRewarded || rewardedAd != null) return;
                  loadingRewarded = true;
                  LoadConfiguration configuration = new LoadConfiguration.Builder(REWARDED_ID).build();
                  RewardedAd.load(configuration, (loadedAd, error) -> runOnUiThread(() -> {
                      loadingRewarded = false;
                      if (loadedAd == null || error != null) {
                          Log.e(TAG, "Rewarded load failed: " + (error == null ? "unknown error" : error.getMessage()));
                          return;
                      }
                      rewardedAd = loadedAd;
                      loadedAd.setOnAdExpired(expired -> runOnUiThread(() -> {
                          if (rewardedAd == expired) rewardedAd = null;
                          loadRewarded();
                      }));
                      if (rewardedButton != null) {
                          rewardedButton.setEnabled(true);
                          rewardedButton.setText("Play Games");
                      }
                  }));
              }

              private void addRewardedOptInButton() {
                  if (contentRoot == null) return;
                  rewardedButton = new Button(this);
                  rewardedButton.setText("Play Games");
                  rewardedButton.setTextSize(12f);
                  rewardedButton.setAllCaps(false);
                  rewardedButton.setEnabled(false);
                  rewardedButton.setOnClickListener(v -> confirmPlayGamesWithRewardedAd());
                  FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, dp(44), Gravity.BOTTOM | Gravity.END);
                  params.bottomMargin = dp(BANNER_HEIGHT_DP + 8);
                  params.rightMargin = dp(8);
                  contentRoot.addView(rewardedButton, params);
              }

              private void confirmPlayGamesWithRewardedAd() {
                  new AlertDialog.Builder(this)
                          .setTitle("Play Games")
                          .setMessage("A rewarded ad may play before continuing. Do you want to watch it?")
                          .setNegativeButton("Cancel", (dialog, which) -> dialog.dismiss())
                          .setPositiveButton("Watch Ad", (dialog, which) -> showRewardedByChoice())
                          .show();
              }

              private void showRewardedByChoice() {
                  if (!unityReady || adShowing) return;
                  if (rewardedAd == null) {
                      Toast.makeText(this, "Rewarded ad is loading. Please try again shortly.", Toast.LENGTH_SHORT).show();
                      loadRewarded();
                      return;
                  }
                  RewardedAd ad = rewardedAd;
                  rewardedAd = null;
                  adShowing = true;
                  if (rewardedButton != null) rewardedButton.setEnabled(false);
                  ad.show(this, new ShowConfiguration.Builder().withCustomRewardString("interexive_reward").build(),
                          new RewardedShowListener() {
                              @Override public void onStarted(RewardedAd shownAd) { Log.d(TAG, "Rewarded ad started"); }
                              @Override public void onClicked(RewardedAd shownAd) { Log.d(TAG, "Rewarded ad clicked"); }
                              @Override public void onRewarded(RewardedAd shownAd) {
                                  runOnUiThread(() -> {
                                      Toast.makeText(MainActivity.this, "Reward earned!", Toast.LENGTH_SHORT).show();
                                      // Let the app HTML start its game flow if it defines window.playGames(),
                                      // or listen for the custom event below.
                                      if (webView != null) {
                                          webView.evaluateJavascript("(function(){if(typeof window.playGames==='function'){window.playGames();}else{window.dispatchEvent(new CustomEvent('interexive:play-games-unlocked'));}})();", null);
                                      }
                                  });
                              }
                              @Override public void onCompleted(RewardedAd shownAd, ShowFinishState state) {
                                  finishFullScreenAd();
                              }
                              @Override public void onFailed(RewardedAd shownAd, UnityAdsError error) {
                                  Log.e(TAG, "Rewarded show failed: " + error.getMessage());
                                  finishFullScreenAd();
                              }
                          });
              }

              private void finishFullScreenAd() {
                  runOnUiThread(() -> {
                      adShowing = false;
                      if (rewardedButton != null) rewardedButton.setEnabled(rewardedAd != null);
                      loadInterstitial();
                      loadRewarded();
                  });
              }
          }
          JAVA

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Interexive-Easy-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
