name: Build Interexive - Easy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare HTML app
        shell: bash
        run: |
          set -euo pipefail

          if [ -f index.html ]; then
            HTML_FILE=index.html
          else
            mapfile -t FILES < <(find . -maxdepth 1 -type f -iname '*.html')
            if [ "${#FILES[@]}" -ne 1 ]; then
              echo "ERROR: Add one HTML file to the repository root, or name it index.html."
              exit 1
            fi
            HTML_FILE="${FILES[0]}"
          fi

          mkdir -p www
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='www/' --exclude='android/' --exclude='node_modules/' --exclude='package.json' --exclude='package-lock.json' --exclude='capacitor.config.json' ./ www/
          cp "$HTML_FILE" www/index.html

          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npm install --save-dev @capacitor/assets

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.interexive.easy",
            "appName": "Interexive - Easy",
            "webDir": "www"
          }
          EOF

          mkdir -p assets
          test -f logo.png || { echo "ERROR: logo.png missing from repository root"; exit 1; }
          cp logo.png assets/icon.png

          npx cap add android
          sed -i '/dependencies {/a\    implementation "com.unity3d.ads:unity-ads:4.21.0"' android/app/build.gradle
                    mkdir -p android/app/src/main/java/com/interexive/easy
          cat > android/app/src/main/java/com/interexive/easy/MainActivity.java <<'EOF'
          package com.interexive.easy;

          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;

          import com.getcapacitor.BridgeActivity;
          import com.unity3d.ads.*;

          public class MainActivity extends BridgeActivity {

              private static final String GAME_ID = "800409689";
              private static final String BANNER = "BP_Banner_Android";
              private static final String INTERSTITIAL = "BP_Interstitial_Android";
              private static final long AD_INTERVAL = 5 * 60 * 1000L;

              private final Handler handler =
                      new Handler(Looper.getMainLooper());

              private LinearLayout bannerContainer;
              private BannerAd banner;
              private InterstitialAd interstitial;

              private boolean loadingBanner = false;
              private boolean loadingInterstitial = false;
              private boolean appResumed = false;

              private final Runnable interstitialTimer = new Runnable() {
                  @Override
                  public void run() {
                      if (!appResumed || isFinishing() || isDestroyed()) {
                          return;
                      }

                      if (!hasWindowFocus()) {
                          handler.postDelayed(this, 30000L);
                          return;
                      }

                      if (interstitial == null) {
                          loadInterstitial();
                          scheduleNextInterstitial();
                          return;
                      }

                      InterstitialAd ad = interstitial;
                      interstitial = null;

                      try {
                          ad.show(
                                  MainActivity.this,
                                  new ShowConfiguration.Builder().build(),
                                  new InterstitialShowListener() {
                                      @Override
                                      public void onStarted(InterstitialAd ad) {
                                      }

                                      @Override
                                      public void onClicked(InterstitialAd ad) {
                                      }

                                      @Override
                                      public void onCompleted(
                                              InterstitialAd ad,
                                              ShowFinishState state) {
                                          afterInterstitial();
                                      }

                                      @Override
                                      public void onFailed(
                                              InterstitialAd ad,
                                              UnityAdsError error) {
                                          afterInterstitial();
                                      }
                                  }
                          );
                      } catch (Exception e) {
                          afterInterstitial();
                      }
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  FrameLayout content =
                          findViewById(android.R.id.content);

                  bannerContainer = new LinearLayout(this);
                  bannerContainer.setGravity(Gravity.CENTER_HORIZONTAL);

                  FrameLayout.LayoutParams params =
                          new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT,
                                  Gravity.BOTTOM
                          );

                  content.addView(bannerContainer, params);

                  InitializationConfiguration config =
                          new InitializationConfiguration.Builder(GAME_ID)
                                  .withTestMode(false)
                                  .build();

                  UnityAds.initialize(config, error -> {
                      if (error == null) {
                          loadBanner();
                          loadInterstitial();
                      }
                  });
              }

              private void loadBanner() {
                  if (loadingBanner || banner != null) {
                      return;
                  }

                  loadingBanner = true;

                  BannerShowListener listener = new BannerShowListener() {
                      @Override
                      public void onImpression(BannerAd ad) {
                      }

                      @Override
                      public void onClicked(BannerAd ad) {
                      }

                      @Override
                      public void onFailedToShow(
                              BannerAd ad, UnityAdsError error) {
                      }
                  };

                  BannerConfiguration config =
                          new BannerConfiguration.Builder(
                                  BANNER,
                                  new BannerSize(320, 50),
                                  listener
                          ).build();

                  BannerAd.load(config, new LoadListener<BannerAd>() {
                      @Override
                      public void onAdLoaded(
                              BannerAd ad, UnityAdsError error) {
                          loadingBanner = false;

                          if (error != null || ad == null) {
                              handler.postDelayed(
                                      () -> loadBanner(), 60000L);
                              return;
                          }

                          banner = ad;
                          View bannerView = ad.getView();

                          if (bannerView != null) {
                              bannerContainer.removeAllViews();
                              bannerContainer.addView(
                                      bannerView,
                                      new LinearLayout.LayoutParams(
                                              ViewGroup.LayoutParams.MATCH_PARENT,
                                              ViewGroup.LayoutParams.WRAP_CONTENT
                                      )
                              );
                          } else {
                              banner = null;
                              handler.postDelayed(
                                      () -> loadBanner(), 60000L);
                          }
                      }
                  });
              }

              private void loadInterstitial() {
                  if (loadingInterstitial || interstitial != null) {
                      return;
                  }

                  loadingInterstitial = true;

                  LoadConfiguration config =
                          new LoadConfiguration.Builder(INTERSTITIAL)
                                  .build();

                  InterstitialAd.load(
                          config,
                          new LoadListener<InterstitialAd>() {
                              @Override
                              public void onAdLoaded(
                                      InterstitialAd ad,
                                      UnityAdsError error) {
                                  loadingInterstitial = false;

                                  if (error != null || ad == null) {
                                      handler.postDelayed(
                                              () -> loadInterstitial(),
                                              60000L);
                                  } else {
                                      interstitial = ad;
                                  }
                              }
                          }
                  );
              }

              private void afterInterstitial() {
                  handler.post(() -> {
                      loadInterstitial();
                      scheduleNextInterstitial();
                  });
              }

              private void scheduleNextInterstitial() {
                  handler.removeCallbacks(interstitialTimer);

                  if (appResumed) {
                      handler.postDelayed(
                              interstitialTimer, AD_INTERVAL);
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  appResumed = true;
                  scheduleNextInterstitial();
              }

              @Override
              protected void onPause() {
                  appResumed = false;
                  handler.removeCallbacks(interstitialTimer);
                  super.onPause();
              }

              @Override
              protected void onDestroy() {
                  handler.removeCallbacksAndMessages(null);
                  super.onDestroy();
              }
          }
          EOF
          npx cap sync android
          npx @capacitor/assets generate --android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Interexive-Easy-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
