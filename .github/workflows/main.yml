name: Build Interexive - Easy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare HTML app
        shell: bash
        run: |
          set -euo pipefail

          if [ -f index.html ]; then
            HTML_FILE=index.html
          else
            mapfile -t FILES < <(find . -maxdepth 1 -type f -iname '*.html')
            if [ "${#FILES[@]}" -ne 1 ]; then
              echo "ERROR: Add one HTML file to the repository root, or name it index.html."
              exit 1
            fi
            HTML_FILE="${FILES[0]}"
          fi

          mkdir -p www
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='www/' --exclude='android/' --exclude='node_modules/' --exclude='package.json' --exclude='package-lock.json' --exclude='capacitor.config.json' ./ www/
          cp "$HTML_FILE" www/index.html

          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npm install --save-dev @capacitor/assets

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.interexive.easy",
            "appName": "Interexive - Easy",
            "webDir": "www"
          }
          EOF

          mkdir -p assets
          test -f logo.png || { echo "ERROR: logo.png missing from repository root"; exit 1; }
          cp logo.png assets/icon.png

          npx cap add android
          sed -i '/dependencies {/a\    implementation "com.unity3d.ads:unity-ads:4.21.0"' android/app/build.gradle
                              mkdir -p android/app/src/main/java/com/interexive/easy
          cat > android/app/src/main/java/com/interexive/easy/MainActivity.java <<'EOF'
          package com.interexive.easy;

          import android.os.Bundle;
          import android.util.Log;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.Toast;

          import com.getcapacitor.BridgeActivity;
          import com.unity3d.ads.*;

          public class MainActivity extends BridgeActivity {
              private static final String GAME_ID = "800409689";
              private static final String BANNER = "BP_Banner_Android";
              private static final String REWARDED = "BP_Rewarded_Android";

              private FrameLayout root;
              private LinearLayout adPanel;
              private Button rewardButton;
              private BannerAd banner;
              private RewardedAd rewarded;
              private boolean loadingRewarded = false;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  root = findViewById(android.R.id.content);
                  createAdPanel();

                  InitializationConfiguration config =
                      new InitializationConfiguration.Builder(GAME_ID)
                          .withTestMode(false)
                          .build();

                  UnityAds.initialize(config, error -> {
                      if (error != null) {
                          Log.e("UnityAds",
                              "Initialization failed: " + error.getMessage());

                          runOnUiThread(() -> {
                              rewardButton.setText("Ads unavailable");
                              rewardButton.setEnabled(false);
                          });
                          return;
                      }

                      runOnUiThread(() -> {
                          loadBanner();
                          loadRewarded();
                      });
                  });
              }

              private int dp(int value) {
                  return (int) (value *
                      getResources().getDisplayMetrics().density + 0.5f);
              }

              private void createAdPanel() {
                  adPanel = new LinearLayout(this);
                  adPanel.setOrientation(LinearLayout.VERTICAL);
                  adPanel.setGravity(Gravity.CENTER_HORIZONTAL);
                  adPanel.setPadding(dp(8), dp(8), dp(8), dp(8));

                  FrameLayout.LayoutParams panelParams =
                      new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL);

                  root.addView(adPanel, panelParams);

                  rewardButton = new Button(this);
                  rewardButton.setText("Loading Rewarded Ad...");
                  rewardButton.setEnabled(false);

                  LinearLayout.LayoutParams buttonParams =
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT);

                  adPanel.addView(rewardButton, buttonParams);

                  rewardButton.setOnClickListener(v -> {
                      if (rewarded == null) {
                          Toast.makeText(this, "Ad is loading",
                              Toast.LENGTH_SHORT).show();
                          loadRewarded();
                          return;
                      }

                      RewardedAd ad = rewarded;
                      rewarded = null;
                      rewardButton.setEnabled(false);
                      rewardButton.setText("Loading next ad...");

                      ad.show(
                          new ShowConfiguration.Builder().build(),
                          new RewardedShowListener() {
                              @Override
                              public void onStarted(RewardedAd ad) {}

                              @Override
                              public void onClicked(RewardedAd ad) {}

                              @Override
                              public void onRewarded(RewardedAd ad) {
                                  runOnUiThread(() ->
                                      Toast.makeText(
                                          MainActivity.this,
                                          "Reward earned!",
                                          Toast.LENGTH_LONG).show());
                              }

                              @Override
                              public void onCompleted(
                                  RewardedAd ad, ShowFinishState state) {
                                  runOnUiThread(() -> loadRewarded());
                              }

                              @Override
                              public void onFailed(
                                  RewardedAd ad, UnityAdsError error) {
                                  Log.e("UnityAds",
                                      "Rewarded show failed: "
                                          + error.getMessage());

                                  runOnUiThread(() -> loadRewarded());
                              }
                          }
                      );
                  });
              }

              private void loadBanner() {
                  BannerShowListener listener = new BannerShowListener() {
                      @Override
                      public void onBannerShown(BannerAd ad) {}

                      @Override
                      public void onBannerClicked(BannerAd ad) {}

                      @Override
                      public void onBannerFailedToShow(
                          BannerAd ad, UnityAdsError error) {
                          Log.e("UnityAds",
                              "Banner show failed: " + error.getMessage());
                      }
                  };

                  BannerLoadConfiguration config =
                      new BannerLoadConfiguration.Builder(
                          BANNER, new BannerSize(320, 50))
                          .withListener(listener)
                          .build();

                  BannerAd.load(config, (ad, error) -> {
                      if (ad == null) {
                          Log.e("UnityAds", "Banner load failed: "
                              + (error == null
                                  ? "unknown error"
                                  : error.getMessage()));
                          return;
                      }

                      banner = ad;

                      runOnUiThread(() -> {
                          if (isFinishing()) return;

                          View bannerView = banner.getView();

                          if (bannerView == null
                                  || bannerView.getParent() != null) {
                              return;
                          }

                          LinearLayout.LayoutParams bannerParams =
                              new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.WRAP_CONTENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT);

                          bannerParams.gravity = Gravity.CENTER_HORIZONTAL;
                          bannerParams.topMargin = dp(24);

                          adPanel.addView(bannerView, bannerParams);
                      });
                  });
              }

              private void loadRewarded() {
                  if (loadingRewarded || rewarded != null || isFinishing()) {
                      return;
                  }

                  loadingRewarded = true;
                  rewardButton.setEnabled(false);
                  rewardButton.setText("Loading Rewarded Ad...");

                  LoadConfiguration config =
                      new LoadConfiguration.Builder(REWARDED).build();

                  RewardedAd.load(config, (ad, error) -> {
                      loadingRewarded = false;

                      if (ad == null) {
                          Log.e("UnityAds", "Rewarded load failed: "
                              + (error == null
                                  ? "unknown error"
                                  : error.getMessage()));

                          runOnUiThread(() -> {
                              if (isFinishing()) return;
                              rewardButton.setText("Retry Rewarded Ad");
                              rewardButton.setEnabled(true);
                          });
                          return;
                      }

                      rewarded = ad;

                      ad.setOnAdExpired(expired -> {
                          if (rewarded == expired) {
                              rewarded = null;
                          }

                          runOnUiThread(() -> {
                              if (isFinishing()) return;
                              rewardButton.setText("Reload Rewarded Ad");
                              rewardButton.setEnabled(true);
                          });
                      });

                      runOnUiThread(() -> {
                          if (isFinishing()) return;
                          rewardButton.setText("Watch Rewarded Ad");
                          rewardButton.setEnabled(true);
                      });
                  });
              }
          }
          EOF
          npx cap sync android
          npx @capacitor/assets generate --android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Interexive-Easy-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
